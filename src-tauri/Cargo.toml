[package]
name = "foxen"
version = "0.1.0"
description = "Potente gestor de ramas y repositorios git para escritorio"
authors = ["foxbuntu"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "foxen_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "macros"] }
parking_lot = "0.12"
log = "0.4"
env_logger = "0.11"
dirs = "6"
once_cell = "1"
time = { version = "0.3", features = ["formatting", "parsing", "macros", "local-offset"] }
url = "2"
base64 = "0.22"
keyring = { version = "3", features = ["linux-native", "sync-secret-service"] }
reqwest = { version = "0.12", features = ["json", "rustls-tls"] }
tokio-util = { version = "0.7", features = ["io-util"] }
futures = "0.3"
# git2 0.20.x: 0.21 reescribio la API de cherry-pick/revert/stash/patch.
git2 = { version = "0.20.4", features = ["vendored-libgit2", "https", "ssh"] }
portable-pty = "0.9.0"
notify = "8.2.0"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
