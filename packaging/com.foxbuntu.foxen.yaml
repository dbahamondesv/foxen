# Manifest Flatpak de Foxen.
#
# Estrategia: se compila el paquete .deb (preferiblemente con ./build-in-container.sh,
# que baja el suelo de glibc) y este manifest lo desempaqueta dentro del runtime
# Flatpak. Es la variante que recomienda la guia oficial de Tauri y evita
# reconstruir Node/Rust dentro del sandbox.
#
# Construir el .deb compatible:
#   ./build-in-container.sh
#   # o en el host: npm run tauri build -- --bundles deb
#
# Construir el flatpak en local:
#   flatpak install --user flathub org.flatpak.Builder
#   flatpak install --user flathub org.gnome.Platform//50 org.gnome.Sdk//50
#   flatpak run --user org.flatpak.Builder --force-clean --user --disable-cache \
#       --repo flatpak-repo build-dir packaging/com.foxbuntu.foxen.yaml
#   flatpak build-bundle flatpak-repo foxen.flatpak com.foxbuntu.foxen
#   flatpak install --user ./foxen.flatpak
#   flatpak run com.foxbuntu.foxen
#
# Nota: el id de escritorio se llama `Foxen.desktop` porque es el nombre que genera
# el empaquetador de Tauri y asi el mismo metainfo AppStream vale para .deb y
# Flatpak. Para publicar en Flathub habra que renombrarlo a com.foxbuntu.foxen.desktop.
#
# Al enviar a Flathub hay que sustituir la fuente `file` por una `url` remota
# (release de GitHub) con su `sha256`, porque Flathub construye sin red local.

id: com.foxbuntu.foxen
runtime: org.gnome.Platform
runtime-version: '50'
sdk: org.gnome.Sdk
command: foxen

finish-args:
  # --- Renderizado de la ventana ---
  - --share=ipc
  - --socket=wayland
  - --socket=fallback-x11
  - --device=dri

  # --- Remotos Git ---
  - --share=network
  # Acceso a $SSH_AUTH_SOCK: imprescindible porque el backend resuelve las claves
  # con git2::Cred::ssh_key_from_agent(). Documentado por Flatpak como requisito
  # para "Git clients or SSH frontends".
  - --socket=ssh-auth

  # --- Eleccion de repositorios via portal ---
  - --talk-name=org.freedesktop.portal.*
  - --talk-name=org.gtk.vfs.*
  - --filesystem=xdg-run/gvfsd
  # Carpetas que el portal puede conceder al abrir un repositorio.
  - --filesystem=xdg-documents
  - --filesystem=xdg-download
  - --filesystem=xdg-public-share
  - --filesystem=xdg-pictures
  - --filesystem=xdg-music
  - --filesystem=xdg-videos

  # --- Credenciales HTTPS persistentes (secret-service) ---
  - --talk-name=org.freedesktop.secrets

  # --- Avisos ---
  - --talk-name=org.freedesktop.Notifications

modules:
  - name: foxen
    buildsystem: simple
    sources:
      # Paquete construido en el host.
      - type: file
        path: ../dist/packages/deb/Foxen_0.1.0_amd64.deb
        # Solo arquitectura x86_64 por ahora.
        only-arches: [x86_64]

      # Para Flathub: subir el .deb a una release y reemplazar lo anterior por
      #   - type: file
      #     url: https://github.com/foxbuntu/foxen/releases/download/v0.1.0/foxen_0.1.0_amd64.deb
      #     sha256: <checksum>
      #     only-arches: [x86_64]

      # Metadatos AppStream y .desktop compartidos con el .deb.
      - type: file
        path: com.foxbuntu.foxen.metainfo.xml
      - type: file
        path: foxen.desktop

    build-commands:
      - set -e
      - mkdir -p deb-extract
      - cd deb-extract && ar x ../*.deb && cd ..
      # El post-proceso del .deb usa compresion xz; el glob admite .gz o .xz.
      - tar -C deb-extract -xf deb-extract/data.tar.*

      # Binario
      - install -Dm755 deb-extract/usr/bin/foxen /app/bin/foxen

      # Metadatos AppStream (obligatorios para Flathub)
      - install -Dm644 com.foxbuntu.foxen.metainfo.xml
        /app/share/metainfo/com.foxbuntu.foxen.metainfo.xml

      # .desktop compartido con el .deb; Flatpak solo exporta el id de la app.
      - install -Dm644 foxen.desktop
        /app/share/applications/com.foxbuntu.foxen.desktop

      # Iconos. El .deb de Tauri genera 32x32, 128x128 y 256x256@2 (512 px reales).
      # Flathub pide como minimo 128x128 y recomienda 256x256; se instala tambien
      # 512x512. La falta de un 256x256 nativo se cubre al generar el set de
      # iconos definitivo de Foxen.
      # Iconos con el id de la app (Flatpak solo exporta esos nombres).
      - install -Dm644 deb-extract/usr/share/icons/hicolor/32x32/apps/com.foxbuntu.foxen.png
        /app/share/icons/hicolor/32x32/apps/com.foxbuntu.foxen.png
      - install -Dm644 deb-extract/usr/share/icons/hicolor/128x128/apps/com.foxbuntu.foxen.png
        /app/share/icons/hicolor/128x128/apps/com.foxbuntu.foxen.png
      - install -Dm644 deb-extract/usr/share/icons/hicolor/512x512/apps/com.foxbuntu.foxen.png
        /app/share/icons/hicolor/512x512/apps/com.foxbuntu.foxen.png

    cleanup:
      - /include
      - deb-extract
      - '*.deb'